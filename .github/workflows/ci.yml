name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.lua }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lua: ['5.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v9
        with:
          luaVersion: ${{ matrix.lua }}

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install dependencies
        run: make deps

      - name: Lint
        run: make lint

      - name: Run tests
        run: make build-test

      - name: Run examples
        run: make check-examples
